<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-input
      label="Cari Produk"
      labelPlacement="stacked"
      placeholder="Ketik nama produk..."
      [(ngModel)]="searchText"
      (ionInput)="searchProduct()">
    </ion-input>
  </ion-item>
  
  <ion-list>
    <ion-item *ngFor="let product of products">
      <ion-label>
        <h2>{{ product.name }}</h2>
        <p>{{ product.category }}</p>
        <p>Harga: Rp {{ product.sellingPrice }}</p>
        <p>Stok: {{ product.stock }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
