<ion-app>

  <ion-menu contentId="main-content">

    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>SIMOBILE</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>

      <ion-list>

        <ion-menu-toggle>
          <ion-item routerLink="/dashboard">
            <ion-icon name="home-outline" slot="start"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>

          <ion-item routerLink="/produk">
            <ion-icon name="cube-outline" slot="start"></ion-icon>
            <ion-label>Produk</ion-label>
          </ion-item>

          <ion-item routerLink="/transaksi">
            <ion-icon name="cart-outline" slot="start"></ion-icon>
            <ion-label>Transaksi</ion-label>
          </ion-item>

          <ion-item routerLink="/profil">
            <ion-icon name="person-outline" slot="start"></ion-icon>
            <ion-label>Profil</ion-label>
          </ion-item>

          <ion-item>
            <ion-icon name="settings-outline" slot="start"></ion-icon>
            <ion-label>Pengaturan</ion-label>
          </ion-item>

          <ion-item>
            <ion-icon name="information-circle-outline" slot="start"></ion-icon>
            <ion-label>Tentang Aplikasi</ion-label>
          </ion-item>

          <ion-item>
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item>

        </ion-menu-toggle>

      </ion-list>

    </ion-content>

  </ion-menu>


  <ion-router-outlet id="main-content"></ion-router-outlet>


  <ion-tabs>

    <ion-tab-bar slot="bottom">

      <ion-tab-button tab="dashboard" href="/dashboard">
        <ion-icon name="home-outline"></ion-icon>
        <ion-label>Dashboard</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="produk" href="/produk">
        <ion-icon name="cube-outline"></ion-icon>
        <ion-label>Produk</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="transaksi" href="/transaksi">
        <ion-icon name="cart-outline"></ion-icon>
        <ion-label>Transaksi</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="profil" href="/profil">
        <ion-icon name="person-outline"></ion-icon>
        <ion-label>Profil</ion-label>
      </ion-tab-button>

    </ion-tab-bar>

  </ion-tabs>

</ion-app>
